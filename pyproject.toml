[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-coder"
version = "1.1.0"
description = "Graph-based LLM agent runtime with tool calling and checkpointing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpcore2>=2.13.0",
    "jinja2>=3.1",
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.15.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
extend-select = ["I", "RUF100", "RUF101", "RUF102"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.tmp/pytest", "-p", "no:cacheprovider"]

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
strict_bytes = true
enable_error_code = [
    "redundant-cast",
    "possibly-undefined",
    "unused-awaitable",
    "truthy-iterable",
    "ignore-without-code",
    "unused-ignore",
]
exclude = ["\\.venv", "build", "\\.tmp"]
